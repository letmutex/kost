lint:
  rules:
    - id: long-function
      severity: warning
      allow_where_override: true
      options:
        max_lines: 80
      where:
        function.lines: gt(options.max_lines)
      report_at:
        - function.name
        - function.end
      message: "Function '${function.name}' is ${function.lines} lines (limit: ${options.max_lines})"

    - id: deep-indent
      severity: warning
      allow_where_override: true
      options:
        max_indent: 32
      where:
        file.max_indent_spaces: gt(options.max_indent)
      report_at: file.max_indent_spaces_at
      message: "Max indent depth is ${file.max_indent_spaces} spaces (limit: ${options.max_indent})"

    - id: too-many-parameters
      severity: warning
      allow_where_override: true
      options:
        max_params: 7
      where:
        function.parameters_count: gt(options.max_params)
      report_at: function.name
      message: "Function '${function.name}' has ${function.parameters_count} parameters (limit: ${options.max_params})"

    - id: long-class-name
      severity: warning
      allow_where_override: true
      options:
        max_length: 40
      where:
        all:
          - class.name.length: gt(options.max_length)
          - class.name: not(has(" "))
      report_at: class.name
      message: "Class '${class.name}' name length is ${class.name.length} (limit: ${options.max_length})"

    - id: long-function-name
      severity: warning
      allow_where_override: true
      options:
        max_length: 40
      where:
        all:
          - function.name.length: gt(options.max_length)
          - function.name: not(has(" "))
          - function.annotations: not(has("@Test"))
      report_at: function.name
      message: "Function '${function.name}' name length is ${function.name.length} (limit: ${options.max_length})"

    - id: long-variable-name
      severity: warning
      allow_where_override: true
      options:
        max_length: 40
      where:
        all:
          - variable.name.length: gt(options.max_length)
          - variable.name: not(has(" "))
      report_at: variable.name
      message: "Variable '${variable.name}' name length is ${variable.name.length} (limit: ${options.max_length})"

    - id: long-file
      severity: warning
      allow_where_override: true
      options:
        max_lines: 600
      where:
        file.lines: gt(options.max_lines)
      report_at:
        - file.start
        - file.end
      message: "File is ${file.lines} lines (limit: ${options.max_lines})"

    - id: too-many-file-functions
      severity: warning
      allow_where_override: true
      options:
        max_functions: 20
      where:
        file.functions_count: gt(options.max_functions)
      message: "File has ${file.functions_count} functions (limit: ${options.max_functions})"
