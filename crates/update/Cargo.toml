[package]
name = "update"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Self-update command implementation for kost"

[dependencies]
cli = { path = "../cli" }
common = { path = "../common" }
self_update = { version = "1.3", default-features = false, features = [
    "github",
    "reqwest",
    "rustls",
    "progress-bar",
    "archive-tar",
    "compression-tar-gz",
    "archive-zip",
    "compression-zip-deflate",
    "checksums",
] }
[lints]
workspace = true
