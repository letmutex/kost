[package]
name = "lsp"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Fast JVM-free Kotlin static analysis & language server engine"

[dependencies]
common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tree-sitter = "0.22"
tree-sitter-kotlin = { path = "../../vendor/tree-sitter-kotlin" }
ignore = "0.4"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { workspace = true }
ahash = "0.8"
smol_str = "0.3"
crossbeam-channel = "0.5"
toml = "0.8"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
regex = "1.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
