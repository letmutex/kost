[package]
name = "kost"
version = "0.1.0"
edition = "2024"
authors = ["letmutex"]
license = "Apache-2.0"
description = "Fast JVM-free Kotlin static linter, formatter, and language server"
repository = "https://github.com/letmutex/kost"
homepage = "https://github.com/letmutex/kost"
documentation = "https://docs.rs/kost"
keywords = ["kotlin", "lsp", "language-server", "linter", "formatter", "static-analysis"]
categories = ["development-tools"]
readme = "README.md"

[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/lsp",
    "crates/lint",
    "crates/format",
    "crates/update",
    "crates/common",
]
exclude = [
    "vendor/tree-sitter-kotlin",
]

[workspace.dependencies]
cli = { path = "crates/cli" }
common = { path = "crates/common" }
format = { path = "crates/format" }
lint = { path = "crates/lint" }
lsp = { path = "crates/lsp" }
update = { path = "crates/update" }
tree-sitter-kotlin = { path = "vendor/tree-sitter-kotlin" }
ahash = "0.8"
crossbeam-channel = "0.5"
ignore = "0.4"
indexmap = "2"
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.2"
smallvec = "1"
smol_str = "0.3"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tree-sitter = "0.22"
url = "2.5"

[workspace.lints.clippy]
wildcard_imports = "deny"
enum_glob_use = "deny"

[[bin]]
name = "kost"
path = "src/main.rs"

[dependencies]
cli = { workspace = true }
lsp = { workspace = true }
lint = { workspace = true }
format = { workspace = true }
update = { workspace = true }
common = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
ahash = { workspace = true }
ignore = { workspace = true }
smol_str = { workspace = true }
tower-lsp = { workspace = true }
rayon = { workspace = true }

[lints]
workspace = true

[profile.release]
debug = true

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "index_jar_bench"
harness = false

[[bench]]
name = "indexer_bench"
harness = false

[[bench]]
name = "references_bench"
harness = false

[[bench]]
name = "lint_bench"
harness = false

[[bench]]
name = "format_bench"
harness = false
